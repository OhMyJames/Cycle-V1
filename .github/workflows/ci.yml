# Two jobs, sized for a 2-core, 4 GB machine (GitHub's standard runner is no smaller).
#
#  check        every push and pull request. The same `bun run check` as the pre-commit hook: about
#               7 s of work and under 0.6 GB at its peak, so nearly all of the time is installing.
#  integration  every pull request (only the suites the change can affect: scripts/integration-plan.ts says
#               which, and the log and the run's summary say why), and by hand and every night (all of
#               them). Starts real processes (Claude, a daemon, Electron under xvfb): serial, a deadline per
#               suite, about 1.5 GB at its peak. It needs no secrets: the model is a mock, and nothing here
#               may read an API key from the environment. --strict: a suite that skipped itself because the
#               runner lacks Electron, xvfb or sshd is a failure here, not an "ok". Every run leaves a record of
#               its commit, machine and each suite's result and time (the integration-timing artifact); the
#               nightly and manual runs also compare it with the earlier ones in the step summary. That
#               comparison only describes: it does not fail a run, and nothing here blocks a pull request on time.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check

  integration:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # To list and download the earlier runs' timing records.
      actions: read
    env:
      # A pull request: what it changed against its base. Anything else: no change given, so all of them.
      CHANGED: ${{ github.event_name == 'pull_request' && format('--changed origin/{0}', github.base_ref) || '' }}
    steps:
      # The whole history: the plan compares this commit with the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Needs no install: it reads package.json files and git's diff. Says which suites, and why.
      - name: Which suites
        id: plan
        run: bun scripts/integration.ts --plan $CHANGED --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.plan.outputs.any == 'true'
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: integration-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: integration-${{ runner.os }}-
      - name: Libraries Electron needs, and xvfb
        if: steps.plan.outputs.machine == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libxss1
      - run: bun install --frozen-lockfile --ignore-scripts
        if: steps.plan.outputs.any == 'true'
      # bun does not run Electron's postinstall, which is what downloads the binary.
      - run: bun node_modules/.bun/electron@*/node_modules/electron/install.js
        if: steps.plan.outputs.machine == 'true'
      - run: bun run test:integration $CHANGED --strict --summary "$GITHUB_STEP_SUMMARY" --record "$RUNNER_TEMP/integration-timing.json"
        if: steps.plan.outputs.any == 'true'
      # The earlier records, newest 30 still kept; this run's is compared with those from the same kind of machine.
      # Describes, never fails: a missing record or a download that did not work leaves a line, not a red run.
      - name: Timing against the earlier runs
        if: always() && github.event_name != 'pull_request' && steps.plan.outputs.any == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=integration-timing&per_page=30" --jq '.artifacts[] | select(.expired == false) | .id'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "history/$id.zip" && unzip -q -o "history/$id.zip" -d "history/$id" || true
          done
          bun scripts/integration-trend.ts "$RUNNER_TEMP/integration-timing.json" history >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.plan.outputs.any == 'true'
        with:
          name: integration-timing
          path: ${{ runner.temp }}/integration-timing.json
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
      - name: Nothing to run
        if: steps.plan.outputs.any != 'true'
        run: echo "No integration suite is reached by this change; the plan is in the log of 'Which suites'." >> "$GITHUB_STEP_SUMMARY"
