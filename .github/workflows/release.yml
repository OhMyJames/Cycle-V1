# Builds what a user installs.
#
#  push a tag v<version>  builds, signs, notarizes and publishes a GitHub release: the macOS app
#                         (Apple silicon) and the Linux daemon. The tag must equal the version in
#                         apps/desktop/package.json, and its commit must be on main (scripts/release-guard.ts).
#  run by hand            builds the same and uploads them as workflow artifacts, nothing published.
#                         With "sign" off (the default) the app is only ad hoc signed, which needs no
#                         secrets: this is how the macOS job is iterated on.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign with the Developer ID and notarize (needs the Apple secrets)
        type: boolean
        default: false
      runner:
        description: Where the macOS app is built
        type: choice
        options: [github, self-hosted]
        default: github

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    timeout-minutes: 4
    runs-on: [self-hosted, macOS, ARM64]
    env:
      PROFILE: ${{ vars.APPLE_NOTARY_PROFILE }}
    steps:
      - name: Sign a disposable executable with each Developer ID Application identity
        shell: bash
        run: |
          set -eu
          work=$(mktemp -d "$RUNNER_TEMP/cycle-probe.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          security find-identity -v -p codesigning | awk '/"Developer ID Application:/ {print $2}' > "$work/identities"
          successes=0
          while read -r certificate; do
            cp /usr/bin/true "$work/sample"
            if /usr/bin/codesign --force --timestamp=none --sign "$certificate" "$work/sample" && /usr/bin/codesign --verify --strict "$work/sample"; then
              echo "Signing succeeded using public certificate $certificate"
              successes=$((successes + 1))
            else
              echo "Signing failed using public certificate $certificate"
            fi
          done < "$work/identities"
          test "$successes" -gt 0
      - name: Authenticate the configured notarytool profile
        if: always()
        run: |
          test -n "$PROFILE"
          xcrun notarytool history --keychain-profile "$PROFILE" --output-format json >/dev/null

  check:
    if: github.ref_name != 'codex/cycl-105-keychain-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: whether the tagged commit is on main cannot be told from a shallow clone.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Before anything is built, signed or published (the other jobs need this one). The current main and
      # an older commit of main (a release made later for a past version) pass; a tag on a branch that was
      # never merged does not, whatever version its package.json says. A manual run from a branch publishes
      # nothing, so it is not asked.
      - name: The tag is on main
        if: github.ref_type == 'tag'
        run: bun scripts/release-guard.ts HEAD --main origin/main
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: The tag is the app's version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version apps/desktop/package.json)"
      # The owner's rule: a release moves only the third number of the newest release.
      - name: The tag only moves the patch number
        if: github.ref_type == 'tag'
        run: bun scripts/release-guard.ts --step "$GITHUB_REF_NAME"
      - run: bun run check

  daemon-linux:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd apps/daemon build
      - name: The built daemon runs, with nothing around it
        run: |
          D=apps/daemon/dist/cycle-linux-x64
          ! env -i PATH=/usr/bin:/bin "$D/cycle" status --data-dir "$RUNNER_TEMP/d"
          env -i PATH=/usr/bin:/bin "$D/claude" --version
          test "$(env -i PATH=/usr/bin:/bin "$D/cycle" version)" = "$(jq -r .version apps/desktop/package.json)"
      - name: Checksum
        working-directory: apps/daemon/dist
        run: sha256sum cycle-linux-x64.tar.gz > cycle-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-x64
          path: |
            apps/daemon/dist/cycle-linux-x64.tar.gz
            apps/daemon/dist/cycle-linux-x64.tar.gz.sha256

  macos:
    needs: check
    # Apple silicon. Only arm64 is shipped. GitHub's macOS arm64 runners can queue for a long time, so
    # the build can go to the owner's own Mac (self-hosted): chosen by hand with the "runner" input, or
    # for a tag by the repository variable RELEASE_RUNNER=self-hosted. Only this workflow uses it, and it
    # only runs for tags and manual runs, which need write access to the repository.
    runs-on: ${{ (inputs.runner == 'self-hosted' || vars.RELEASE_RUNNER == 'self-hosted') && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-latest' }}
    timeout-minutes: 45
    env:
      BUNDLE: apps/desktop/build/Cycle.app/Contents/Resources/app
      # A tag signs only when the repository variable RELEASE_SIGN is 'true'; by hand, when asked.
      SIGN: ${{ (github.event_name == 'push' && vars.RELEASE_SIGN == 'true') || inputs.sign }}
      # Set on the repository (a variable, not a secret: only a name) when the Mac that builds already holds
      # the identity and a notarytool profile in its keychain. Then no Apple secret is needed at all.
      APPLE_NOTARY_PROFILE: ${{ vars.APPLE_NOTARY_PROFILE }}
      APPLE_SIGN_IDENTITY: ${{ vars.APPLE_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd apps/desktop package

      # What is inside the app has to work on this platform: the compiled daemon, and the Claude
      # binary of the darwin SDK package. Checked before signing and again after, because the hardened
      # runtime can stop a Bun executable that ran fine unsigned.
      - name: The bundled daemon and Claude run (ad hoc)
        run: |
          set +e
          "$BUNDLE/bin/cycle" status --data-dir "$RUNNER_TEMP/d1"; test $? -eq 1 || exit 1
          "$BUNDLE/bin/claude" --version || exit 1
          test "$("$BUNDLE/bin/cycle" version)" = "$(jq -r .version apps/desktop/package.json)" || exit 1
          CYCLE_DAEMON_BIN="$PWD/$BUNDLE/bin/cycle" bun run --cwd apps/daemon test:integration

      - name: The app opens a window that connects to its own daemon
        run: CYCLE_PACKAGED_APP="$PWD/apps/desktop/build/Cycle.app" bun test ./apps/desktop/test/integration/packaged.integration.ts

      # An installed copy finds a newer release (served from this machine), downloads it, swaps itself
      # and opens again as the new version. Uses a temporary data directory, never this Mac's own.
      - name: The app updates itself
        run: CYCLE_PACKAGED_APP="$PWD/apps/desktop/build/Cycle.app" bun test ./apps/desktop/test/integration/update.integration.ts

      - name: Import the signing certificate
        if: env.SIGN == 'true' && env.APPLE_NOTARY_PROFILE == ''
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/cycle-signing.keychain-db"
          PASSWORD=$(openssl rand -hex 16)
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cycle.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cycle.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/cycle.p12"
          EXISTING=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          security find-identity -v -p codesigning
          echo "CYCLE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # A service on the owner's Mac may see the login keychain locked even when the owner has it
      # unlocked in a terminal. If the repository has KEYCHAIN_PASSWORD (the Mac user's login password),
      # unlock it here; without it this step does nothing.
      - name: Unlock the login keychain
        if: env.SIGN == 'true' && env.APPLE_NOTARY_PROFILE != ''
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$KEYCHAIN_PASSWORD" ]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$HOME/Library/Keychains/login.keychain-db"
            echo "unlocked"
          else
            echo "no KEYCHAIN_PASSWORD set; leaving the keychain as it is"
          fi

      - name: Where the keychain stands (diagnostic)
        if: env.SIGN == 'true' && env.APPLE_NOTARY_PROFILE != ''
        run: |
          echo "user: $(id -un)  session: $(launchctl managername 2>&1)"
          echo "search list:"; security list-keychains -d user
          echo "default: $(security default-keychain -d user)"
          security show-keychain-info "$HOME/Library/Keychains/login.keychain-db" 2>&1 || true
          security find-identity -v -p codesigning | sed -E 's/^( *[0-9]+\) )[0-9A-F]{40}/\1<hash>/'

      - name: Sign
        if: env.SIGN == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          if [ -z "$APPLE_NOTARY_PROFILE" ]; then
            printf '%s' "$APPLE_API_KEY" > "$APPLE_API_KEY_PATH"
            chmod 600 "$APPLE_API_KEY_PATH"
          fi
          bun run --cwd apps/desktop sign
          rm -f "$APPLE_API_KEY_PATH"

      - name: The signed app passes Gatekeeper, and what is inside it still runs
        if: env.SIGN == 'true'
        run: |
          /usr/sbin/spctl --assess --type execute --verbose=4 apps/desktop/build/Cycle.app
          codesign --verify --deep --strict --verbose=2 apps/desktop/build/Cycle.app
          set +e
          "$BUNDLE/bin/cycle" status --data-dir "$RUNNER_TEMP/d2"; test $? -eq 1 || exit 1
          "$BUNDLE/bin/claude" --version || exit 1
          test "$("$BUNDLE/bin/cycle" version)" = "$(jq -r .version apps/desktop/package.json)" || exit 1
          CYCLE_DAEMON_BIN="$PWD/$BUNDLE/bin/cycle" bun run --cwd apps/daemon test:integration

      - name: The signed app still opens and connects
        if: env.SIGN == 'true'
        run: CYCLE_PACKAGED_APP="$PWD/apps/desktop/build/Cycle.app" bun test ./apps/desktop/test/integration/packaged.integration.ts

      - name: Archive and manifest
        run: bun run --cwd apps/desktop release-assets

      - name: Remove the signing keychain
        if: always() && env.SIGN == 'true'
        run: |
          if [ -n "$CYCLE_KEYCHAIN" ]; then
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
            security delete-keychain "$CYCLE_KEYCHAIN" || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-darwin-arm64${{ env.SIGN == 'true' && '' || '-unsigned' }}
          path: apps/desktop/build/release/*

  publish:
    if: github.ref_type == 'tag'
    needs: [daemon-linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -l assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Without RELEASE_SIGN the app is only ad hoc signed: a browser download is refused by Gatekeeper
        # until its quarantine mark is removed, so such a release is marked a pre-release.
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes ${{ vars.RELEASE_SIGN == 'true' && '' || '--prerelease' }}
