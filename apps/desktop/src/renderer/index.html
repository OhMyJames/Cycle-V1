<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- What the page may do. Agent output is untrusted, so nothing is fetched: no remote images, no
         requests of its own, no frames, no inline scripts. The app talks to main only through the preload. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cycle</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
